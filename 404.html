<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found</title>
    <link href="src/output.css" rel="stylesheet" />
  </head>

  <body
    class="min-h-screen bg-neutral-100 flex items-center justify-center p-8"
  >
    <div class="bg-base-100 shadow-md rounded-xl p-8 max-w-md text-center">
      <h1 class="text-4xl font-black uppercase text-primary">404</h1>
      <h2 class="text-xl font-bold uppercase mt-2">Page Not Found</h2>
      <p class="opacity-60 mt-4">
        The page you are looking for does not exist or may have moved.
      </p>

      <button
        onclick="history.back()"
        class="btn bg-primary text-base-100 border-0"
      >
        Back
      </button>
    </div>
  </body>
</html>
