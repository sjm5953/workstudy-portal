    <meta charset="UTF-8" />

  <body class="h-screen overflow-hidden font-[Google_Sans_Flex]">

        <span class="dock-label uppercase font-bold leading-1 mb-3"

      </a>
      <a href="student-resources.html" class="dock-active">
        <i class="fi fi-br-folder pt-1 mb-1"></i>
        <span class="dock-label uppercase font-bold leading-1 mb-3"
          >Resources</span
        >
      </a>
    </div>
    <!-- main container -->
    <div class="flex flex-col bg-neutral-100 h-full">
      <!--topnav-->
      <div class="h-16 bg-base-100 flex items-center shadow-md px-8">
        <div class="flex items-center gap-1 flex-1 md:flex-0">
          <i
            class="fi fi-br-e-learning pt-1 md:text-lg text-3xl text-primary"
          ></i>
          <h1 class="font-black text-md uppercase hidden md:flex w-30">
            CPO Portal
          </h1>
        </div>
        <div class="flex-0 md:flex-1 flex justify-center hidden md:flex">
          <ul class="menu menu-horizontal">
            <li>
              <a class="stuNavItem" href="student-portal.html">Dashboard</a>
            </li>
            <li>
              <a class="stuNavItem" href="student-schedule.html">Schedule</a>
            </li>
            <li>
              <a class="stuNavItem stuNavActive" href="student-resources.html"
                >Resources</a

            </li>
          </ul>
        </div>

        <a
          class="btn btn-circle btn-sm bg-neutral-200 border-0 shadow-none hidden"
        >
          <i class="fi fi-br-bell pt-1 opacity-60"></i>
        </a>

        <div class="divider divider-horizontal px-4 opacity-20 hidden"></div>

        <!-- USER -->
        <div class="dropdown dropdown-end">
          <div
            id="userContainer"
            tabindex="0"
            role="button"
            class="flex items-center gap-4 cursor-pointer hover:bg-neutral-100 rounded-xl px-3 py-2 transition-colors"

            <div class="avatar">
              <div class="w-8 rounded-full">
                <img id="userAvatar" src="" />
              </div>
            </div>

            <div class="flex flex-col">
              <h1 id="userName" class="text-xs uppercase font-bold">
                Loading...
              </h1>
              <h2 id="userRole" class="text-xs opacity-60 uppercase">
                Loading...
              </h2>
            </div>

            <i class="fi fi-br-angle-small-down pt-1 opacity-60"></i>
          </div>

          <ul
            tabindex="0"
            class="dropdown-content menu bg-base-100 rounded-box z-[100] w-52 p-2 shadow-xl border border-neutral-200 mt-2 uppercase text-xs font-bold"
          >
            <li>
              <a href="student-settings.html">
                <i class="fi fi-br-settings"></i>
                Settings
              </a>
            </li>

            <li>
              <a id="logoutBtn" href="auth.html">
                <i class="fi fi-br-sign-out-alt"></i>
                Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
      <!--body-->
      <div
        class="flex-1 min-h-0 flex justify-center py-8 overflow-hidden mb-18 md:mb-0"
      >
        <div class="w-full max-w-5xl px-8 md:px-0 flex flex-col min-h-0">
          <div
            class="bg-base-100 shadow-md rounded-lg px-8 py-4 bg-linear-to-bl from-[#f3f520] to-[#4DB900] text-base-100 flex items-center justify-between"
          >
            <h1 class="uppercase font-black text-2xl">Resources</h1>
          </div>
          <div class="mt-8">
            <label class="input w-full h-18 rounded-lg shadow-md outline-0">
              <i class="fi fi-rr-search pt-1 text-xl ml-4"></i>
              <input
                type="search"
                class="grow pl-4 outline-0"
                placeholder="Search Contacts, FAQS, Guides and more"
              />
            </label>
          </div>
          <div class="mt-8 grid md:grid-cols-3 gap-4">
            <div
              class="bg-linear-to-tr from-amber-400 to-amber-500 flex flex-col p-4 rounded-xl shadow-md cursor-pointer hover:scale-101 transition-transform"
            >
              <i
                class="fi fi-rr-phone-office pt-1 text-base-100 text-6xl opacity-40"
              ></i>
              <h1 class="font-black text-base-100 uppercase text-2xl">
                CPO<br />Contact List
              </h1>
            </div>
            <div
              class="bg-linear-to-tr from-purple-400 to-purple-500 flex flex-col p-4 rounded-xl shadow-md cursor-pointer hover:scale-101 transition-transform"
            >
              <i
                class="fi fi-rr-phone-office pt-1 text-base-100 text-6xl opacity-40"
              ></i>
              <h1 class="font-black text-base-100 uppercase text-2xl">
                Department<br />Contact List
              </h1>
            </div>
            <div
              class="bg-linear-to-tr from-sky-400 to-sky-500 flex flex-col p-4 rounded-xl shadow-md cursor-pointer hover:scale-101 transition-transform"
            >
              <i
                class="fi fi-rr-workflow-alt pt-1 text-base-100 text-6xl opacity-40"
              ></i>
              <h1 class="font-black text-base-100 uppercase text-2xl">
                Front Desk Flowchart
              </h1>
            </div>
          </div>
          <div class="mt-8">
            <h1 class="font-black uppercase text-xl">All Resources</h1>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPT -->
    <script>
      const AIRTABLE_TOKEN =
        "path5D1SLsZnikHyD.8e47f28d9b3b2913d1ebf07e9b1beb8c0903a82bb49266f19cb98fb4021b0129";
      const BASE_ID = "appYqZMGk18beV4qI";

      const USERS_TABLE = "Users";
      const ROLES_TABLE = "Roles";

      const userId = localStorage.getItem("cpoUserId");

      const avatarEl = document.getElementById("userAvatar");
      const nameEl = document.getElementById("userName");
      const roleEl = document.getElementById("userRole");

      async function fetchUser() {
        if (!userId) {
          window.location.href = "login.html";
          return;
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${USERS_TABLE}/${userId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch user");
        }

        const data = await response.json();
        return data.fields;
      }

      async function fetchRole(roleId) {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${ROLES_TABLE}/${roleId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) return "Role";

        const data = await response.json();
        return data.fields.name || "Role";
      }

      async function loadUserHeader() {
        try {
          const user = await fetchUser();

          avatarEl.src =
            user.avatar_url ||
            "https://img.daisyui.com/images/profile/demo/yellingcat@192.webp";

          nameEl.textContent = user.display_name || "User";

          if (user.role && user.role.length > 0) {
            const roleName = await fetchRole(user.role[0]);
            roleEl.textContent = roleName;
          } else {
            roleEl.textContent = "Standard";
          }
        } catch (err) {
          console.error(err);

          nameEl.textContent = "User";
          roleEl.textContent = "Error";
        }
      }

      loadUserHeader();

      const logoutBtn = document.getElementById("logoutBtn");

      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("cpoUserId");
          localStorage.removeItem("cpoUserEmail");
          localStorage.removeItem("cpoDisplayName");
        });
      }
    </script>
  </body>
</html>
