<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPO Portal</title>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind -->
    <link href="src/output.css" rel="stylesheet" />

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
  </head>

  <body class="h-screen overflow-hidden font-[Google_Sans_Flex]">
    <!-- main container -->
    <div class="flex flex-col bg-neutral-100 h-full">
      <!--topnav-->
      <div class="h-16 bg-base-100 flex items-center shadow-md px-8">
        <div class="flex items-center gap-1">
          <i class="fi fi-br-e-learning pt-1 text-lg text-primary"></i>
          <h1 class="font-black text-md uppercase">CPO Portal</h1>
        </div>
        <div class="flex-1 flex justify-center">
          <ul class="menu menu-horizontal">
            <li>
              <a class="stuNavItem stuNavActive" href="student-portal.html"
                >Dashboard</a
              >
            </li>
            <li>
              <a class="stuNavItem" href="student-schedule.html">Schedule</a>
            </li>
            <li><a class="stuNavItem">Resources</a></li>
          </ul>
        </div>

        <a class="btn btn-circle btn-sm bg-neutral-200 border-0 shadow-none">
          <i class="fi fi-br-bell pt-1 opacity-60"></i>
        </a>

        <div class="divider divider-horizontal px-4 opacity-20"></div>

        <!-- USER -->
        <div class="flex items-center gap-4">
          <div class="avatar">
            <div class="w-8 rounded-full">
              <img id="userAvatar" src="" />
            </div>
          </div>

          <div class="flex flex-col">
            <h1 id="userName" class="text-xs uppercase font-bold">
              Loading...
            </h1>
            <h2 id="userRole" class="text-xs opacity-60 uppercase">
              Loading...
            </h2>
          </div>

          <i class="fi fi-br-angle-small-down pt-1 opacity-60"></i>
        </div>
      </div>
      <!--body-->
      <div class="flex-1 flex flex-col items-center py-8">
        <div class="w-full max-w-5xl px-8 md:px-0">
          <div
            class="bg-base-100 shadow-md rounded-lg px-8 py-4 bg-linear-to-bl from-[#f3f520] to-[#4DB900] text-base-100 flex items-center justify-between"
          >
            <h1 class="uppercase font-black text-2xl">Welcome, firstname</h1>
          </div>
          <div class="grid md:grid-cols-[2fr_1fr] mt-8 gap-8">
            <!--to do card-->
            <div class="bg-base-100 shadow-md rounded-lg flex flex-col">
              <div
                class="flex items-center justify-between px-8 py-4 border-b border-neutral-100"
              >
                <h1 class="text-md uppercase font-bold">To Do</h1>
              </div>
              <div
                id="todoList"
                class="flex flex-col divide-y divide-neutral-100"
              >
                <div class="px-8 py-4 text-xs uppercase opacity-60">
                  Loading to-dos...
                </div>
              </div>
              <div class="inset-shadow-sm px-8 py-4">
                <a
                  href="todo-list.html"
                  class="text-xs font-bold uppercase text-primary"
                  >View All</a
                >
              </div>
            </div>
            <!--upcoming shifts card-->
            <div
              class="bg-base-100 shadow-md rounded-lg flex flex-col row-start-2"
            >
              <div
                class="flex items-center justify-between px-8 py-4 border-b border-neutral-100"
              >
                <h1 class="text-md uppercase font-bold">Upcoming Shifts</h1>
              </div>

              <div
                id="upcomingShiftsList"
                class="flex flex-col divide-y divide-neutral-100"
              >
                <div class="px-8 py-4 text-xs uppercase opacity-60">
                  Loading shifts...
                </div>
              </div>

              <div class="inset-shadow-sm px-8 py-4">
                <a
                  href="student-schedule.html"
                  class="text-xs font-bold uppercase text-primary"
                >
                  View All
                </a>
              </div>
            </div>
            <!--actions card-->
            <div
              class="bg-base-100 shadow-md rounded-lg flex flex-col col-start-2 row-start-1 row-span-2"
            >
              <div
                class="flex items-center justify-between px-8 py-4 border-b border-neutral-100"
              >
                <h1 class="text-md uppercase font-bold">Actions</h1>
              </div>
              <div class="px-8 py-2">
                <ul class="menu w-full uppercase font-bold">
                  <li>
                    <a class="hover:bg-transparent text-primary pl-0"
                      ><i class="fi fi-rr-calendar pt-1"></i
                      ><span class="hover:underline">View All Shifts</span></a
                    >
                  </li>
                  <li>
                    <a
                      class="hover:bg-transparent text-primary hover:underline pl-0"
                      ><i class="fi fi-rr-calendar-plus pt-1"></i
                      ><span class="hover:underline">Add A Shift</span></a
                    >
                  </li>
                  <li>
                    <a
                      class="hover:bg-transparent text-primary hover:underline pl-0"
                      ><i class="fi fi-rr-calendar-check pt-1"></i
                      ><span class="hover:underline">Confirm Shifts</span></a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPT -->
    <script>
      const AIRTABLE_TOKEN =
        "path5D1SLsZnikHyD.8e47f28d9b3b2913d1ebf07e9b1beb8c0903a82bb49266f19cb98fb4021b0129";
      const BASE_ID = "appYqZMGk18beV4qI";

      const USERS_TABLE = "Users";
      const ROLES_TABLE = "Roles";

      const userId = localStorage.getItem("cpoUserId");

      const avatarEl = document.getElementById("userAvatar");
      const nameEl = document.getElementById("userName");
      const roleEl = document.getElementById("userRole");

      async function fetchUser() {
        if (!userId) {
          window.location.href = "login.html";
          return;
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${USERS_TABLE}/${userId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch user");
        }

        const data = await response.json();
        return data.fields;
      }

      async function fetchRole(roleId) {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${ROLES_TABLE}/${roleId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) return "Role";

        const data = await response.json();
        return data.fields.name || "Role";
      }

      const TODO_TABLE = "To Do";
      const todoList = document.getElementById("todoList");

      async function fetchToDos() {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          TODO_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch to-dos");
        }

        const data = await response.json();

        return data.records.filter((record) => {
          const linkedUsers = record.fields.user;

          return Array.isArray(linkedUsers) && linkedUsers.includes(userId);
        });
      }

      function renderToDos(records) {
        if (records.length === 0) {
          todoList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase opacity-60">
        No to-dos found.
      </div>
    `;
          return;
        }

        todoList.innerHTML = records
          .map((record) => {
            const fields = record.fields;
            const link = fields.confirmation_link || "#";

            return `
        <a
          href="${link}"
          class="px-8 py-4 flex flex-col gap-1 hover:bg-neutral-100"
        >
          <h1 class="uppercase font-bold text-sm text-primary">
            ${fields.title || "Untitled To Do"}
          </h1>
          <p class="text-sm opacity-60">
            ${fields.description || ""}
          </p>
        </a>
      `;
          })
          .join("");
      }

      async function loadToDos() {
        try {
          const records = await fetchToDos();
          renderToDos(records);
        } catch (error) {
          console.error(error);
          todoList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase text-error font-bold">
        Something went wrong loading to-dos.
      </div>
    `;
        }
      }

      const SCHEDULE_TABLE = "Schedule";
      const upcomingShiftsList = document.getElementById("upcomingShiftsList");

      function formatShiftDate(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return "";

        return date.toLocaleDateString("en-US", {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }

      function formatShiftTime(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return "";

        return date.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        });
      }

      async function fetchUpcomingShifts() {
        const user = await fetchUser();
        const linkedWorkstudies = user.linked_workstudy || [];

        if (
          !Array.isArray(linkedWorkstudies) ||
          linkedWorkstudies.length === 0
        ) {
          return [];
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          SCHEDULE_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch schedule records");
        }

        const data = await response.json();

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const sevenDaysFromNow = new Date(today);
        sevenDaysFromNow.setDate(today.getDate() + 7);
        sevenDaysFromNow.setHours(23, 59, 59, 999);

        return data.records
          .filter((record) => {
            const fields = record.fields;

            const shiftStart = new Date(fields.shift_start);
            const workstudyIds = fields.workstudy_name || [];

            const belongsToUser = workstudyIds.some((id) =>
              linkedWorkstudies.includes(id),
            );

            return (
              belongsToUser &&
              shiftStart >= today &&
              shiftStart <= sevenDaysFromNow
            );
          })
          .sort((a, b) => {
            return (
              new Date(a.fields.shift_start) - new Date(b.fields.shift_start)
            );
          });
      }

      function renderUpcomingShifts(records) {
        if (records.length === 0) {
          upcomingShiftsList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase opacity-60">
        No upcoming shifts found.
      </div>
    `;
          return;
        }

        upcomingShiftsList.innerHTML = records
          .map((record) => {
            const fields = record.fields;

            return `
        <div class="px-8 py-4 flex flex-col gap-1">
          <h1 class="uppercase font-bold text-sm text-primary">
            ${formatShiftDate(fields.shift_start)}
          </h1>

          <p class="text-sm opacity-60">
            ${formatShiftTime(fields.shift_start)} - ${formatShiftTime(fields.shift_end)}
          </p>

          <span class="w-fit rounded-full px-3 py-1 text-xs uppercase font-bold ${
            fields.shift_status === "Confirmed"
              ? "bg-primary text-base-100"
              : "bg-amber-400 text-neutral"
          }">
            ${fields.shift_status || "Unconfirmed"}
          </span>
        </div>
      `;
          })
          .join("");
      }

      async function loadUpcomingShifts() {
        try {
          const records = await fetchUpcomingShifts();
          renderUpcomingShifts(records);
        } catch (error) {
          console.error(error);

          upcomingShiftsList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase text-error font-bold">
        Something went wrong loading shifts.
      </div>
    `;
        }
      }

      async function loadUserHeader() {
        try {
          const user = await fetchUser();

          avatarEl.src =
            user.avatar_url ||
            "https://img.daisyui.com/images/profile/demo/yellingcat@192.webp";

          nameEl.textContent = user.display_name || "User";

          if (user.role && user.role.length > 0) {
            roleEl.textContent = await fetchRole(user.role[0]);
          } else {
            roleEl.textContent = "Standard";
          }
        } catch (err) {
          console.error(err);
        }
      }

      loadUserHeader();
      loadToDos();
      loadUpcomingShifts();
    </script>
  </body>
</html>
