<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPO Portal</title>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind -->
    <link href="src/output.css" rel="stylesheet" />

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
  </head>

  <body class="h-screen overflow-hidden font-[Google_Sans_Flex]">
    <!-- main container -->
    <div class="flex flex-col bg-neutral-100 h-full">
      <!--topnav-->
      <div class="h-16 bg-base-100 flex items-center shadow-md px-8">
        <div class="flex items-center gap-1">
          <i class="fi fi-br-e-learning pt-1 text-lg text-primary"></i>
          <h1 class="font-black text-md uppercase">CPO Portal</h1>
        </div>
        <div class="flex-1 flex justify-center">
          <ul class="menu menu-horizontal">
            <li>
              <a class="stuNavItem" href="student-portal.html">Dashboard</a>
            </li>
            <li>
              <a class="stuNavItem stuNavActive" href="student-schedule.html"
                >Schedule</a
              >
            </li>
            <li><a class="stuNavItem">Resources</a></li>
          </ul>
        </div>

        <a class="btn btn-circle btn-sm bg-neutral-200 border-0 shadow-none">
          <i class="fi fi-br-bell pt-1 opacity-60"></i>
        </a>

        <div class="divider divider-horizontal px-4 opacity-20"></div>

        <!-- USER -->
        <div class="flex items-center gap-4">
          <div class="avatar">
            <div class="w-8 rounded-full">
              <img id="userAvatar" src="" />
            </div>
          </div>

          <div class="flex flex-col">
            <h1 id="userName" class="text-xs uppercase font-bold">
              Loading...
            </h1>
            <h2 id="userRole" class="text-xs opacity-60 uppercase">
              Loading...
            </h2>
          </div>

          <i class="fi fi-br-angle-small-down pt-1 opacity-60"></i>
        </div>
      </div>
      <!--body-->
      <div class="flex-1 flex justify-center py-8">
        <div class="w-full max-w-5xl px-8 md:px-0 flex flex-col">
          <div
            class="bg-base-100 shadow-md rounded-lg px-8 py-4 bg-linear-to-bl from-[#f3f520] to-[#4DB900] text-base-100 flex items-center justify-between"
          >
            <h1 class="uppercase font-black text-2xl">Welcome, firstname</h1>
          </div>
          <div class="flex-1 mt-4 flex flex-col">
            <div role="tablist" class="tabs tabs-border text-primary">
              <a id="allShiftsTab" role="tab" class="tab">All Shifts</a>
              <a id="needConfirmationTab" role="tab" class="tab tab-active">
                Need Confirmation
              </a>
              <a id="requestsTab" role="tab" class="tab">Requests</a>
            </div>
            <div class="flex-1 bg-base-100 shadow-md rounded-xl mt-4 p-2">
              <div id="allShiftsList" class="divide-y divide-neutral-100"></div>
              <div
                id="needConfirmationList"
                class="hidden divide-y divide-neutral-100"
              ></div>
              <div id="requestsPanel" class="hidden">
                <div
                  class="px-8 py-4 border-b border-neutral-100 flex justify-end"
                >
                  <button
                    id="newRequestBtn"
                    class="btn btn-sm bg-primary text-base-100 border-0"
                  >
                    New Request
                  </button>
                </div>
                <div
                  id="requestsList"
                  class="divide-y divide-neutral-100"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <dialog id="requestShiftModal" class="modal">
      <div class="modal-box max-w-3xl">
        <h3 class="font-black text-2xl uppercase">New Shift Request</h3>

        <div id="requestShiftRows" class="mt-4 flex flex-col gap-4"></div>

        <button id="addRequestRowBtn" class="btn btn-sm mt-4">
          + Add Another Shift
        </button>

        <div class="modal-action">
          <button id="cancelRequestBtn" class="btn">Cancel</button>
          <button id="submitRequestBtn" class="btn bg-neutral text-base-100">
            Submit Request
          </button>
        </div>
      </div>
    </dialog>

    <!-- SCRIPT -->
    <script>
      const AIRTABLE_TOKEN =
        "path5D1SLsZnikHyD.8e47f28d9b3b2913d1ebf07e9b1beb8c0903a82bb49266f19cb98fb4021b0129";
      const BASE_ID = "appYqZMGk18beV4qI";

      const USERS_TABLE = "Users";
      const ROLES_TABLE = "Roles";

      const userId = localStorage.getItem("cpoUserId");

      const avatarEl = document.getElementById("userAvatar");
      const nameEl = document.getElementById("userName");
      const roleEl = document.getElementById("userRole");
      const allShiftsList = document.getElementById("allShiftsList");
      const allShiftsTab = document.getElementById("allShiftsTab");
      const needConfirmationTab = document.getElementById(
        "needConfirmationTab",
      );
      const needConfirmationList = document.getElementById(
        "needConfirmationList",
      );

      const requestsTab = document.getElementById("requestsTab");
      const requestsPanel = document.getElementById("requestsPanel");
      const requestsList = document.getElementById("requestsList");

      const requestShiftModal = document.getElementById("requestShiftModal");
      const newRequestBtn = document.getElementById("newRequestBtn");
      const requestShiftRows = document.getElementById("requestShiftRows");
      const addRequestRowBtn = document.getElementById("addRequestRowBtn");
      const cancelRequestBtn = document.getElementById("cancelRequestBtn");
      const submitRequestBtn = document.getElementById("submitRequestBtn");

      function showRequestsTab() {
        requestsTab.classList.add("tab-active");
        allShiftsTab.classList.remove("tab-active");
        needConfirmationTab.classList.remove("tab-active");

        requestsPanel.classList.remove("hidden");
        allShiftsList.classList.add("hidden");
        needConfirmationList.classList.add("hidden");

        loadRequestedShifts();
      }

      function renderRequestRow() {
        return `
    <div class="request-row grid grid-cols-2 gap-4 bg-neutral-100 rounded-lg p-4">
      <div>
        <label class="label font-bold uppercase text-xs">Start</label>
        <input type="datetime-local" class="request-start input w-full" />
      </div>

      <div>
        <label class="label font-bold uppercase text-xs">End</label>
        <input type="datetime-local" class="request-end input w-full" />
      </div>

      <div class="col-span-2 flex justify-end">
        <button type="button" class="remove-request-row btn btn-xs">
          Remove
        </button>
      </div>
    </div>
  `;
      }

      function openRequestModal() {
        requestShiftRows.innerHTML = renderRequestRow();
        requestShiftModal.showModal();
      }

      function closeRequestModal() {
        requestShiftModal.close();
        requestShiftRows.innerHTML = "";
      }

      async function createRequestedShift({ start, end }) {
        const user = await fetchUser();
        const linkedWorkstudies = user.linked_workstudy || [];

        if (
          !Array.isArray(linkedWorkstudies) ||
          linkedWorkstudies.length === 0
        ) {
          throw new Error("No linked workstudy found for this user.");
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          SCHEDULE_TABLE,
        )}`;

        const response = await fetch(url, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            fields: {
              workstudy_name: [linkedWorkstudies[0]],
              shift_start: new Date(start).toISOString(),
              shift_end: new Date(end).toISOString(),
              shift_status: "Requested",
            },
          }),
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error(errorText);
          throw new Error("Failed to create requested shift.");
        }

        return response.json();
      }

      async function fetchRequestedShifts() {
        const allShifts = await fetchAllUserShifts();

        return allShifts.filter((record) => {
          return record.fields.shift_status === "Requested";
        });
      }

      function renderRequestedShifts(records) {
        if (records.length === 0) {
          requestsList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase opacity-60">
        No requested shifts found.
      </div>
    `;
          return;
        }

        requestsList.innerHTML = records
          .map((record) => {
            const fields = record.fields;

            return `
        <div class="px-8 py-4 flex items-center gap-6">
          <div class="flex-1">
            <h1 class="uppercase font-bold text-sm text-primary">
              ${formatShiftDate(fields.shift_start)}
            </h1>
            <p class="text-sm opacity-60">
              ${formatShiftTime(fields.shift_start)} - ${formatShiftTime(fields.shift_end)}
            </p>
            ${
              fields.notes
                ? `<p class="text-xs opacity-60 mt-1">${fields.notes}</p>`
                : ""
            }
          </div>

          <span class="rounded-full px-3 py-1 text-xs uppercase font-bold bg-neutral-200">
            Requested
          </span>
        </div>
      `;
          })
          .join("");
      }

      async function loadRequestedShifts() {
        try {
          const records = await fetchRequestedShifts();
          renderRequestedShifts(records);
        } catch (error) {
          console.error(error);
          requestsList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase text-error font-bold">
        Something went wrong loading requested shifts.
      </div>
    `;
        }
      }

      newRequestBtn.addEventListener("click", openRequestModal);
      cancelRequestBtn.addEventListener("click", closeRequestModal);

      addRequestRowBtn.addEventListener("click", () => {
        requestShiftRows.insertAdjacentHTML("beforeend", renderRequestRow());
      });

      requestShiftRows.addEventListener("click", (event) => {
        const removeBtn = event.target.closest(".remove-request-row");
        if (!removeBtn) return;

        const rows = document.querySelectorAll(".request-row");
        if (rows.length === 1) return;

        removeBtn.closest(".request-row").remove();
      });

      submitRequestBtn.addEventListener("click", async () => {
        const rows = Array.from(document.querySelectorAll(".request-row"));

        const requests = rows.map((row) => {
          return {
            start: row.querySelector(".request-start").value,
            end: row.querySelector(".request-end").value,
          };
        });

        if (requests.some((request) => !request.start || !request.end)) {
          alert("Please enter a start and end time for each requested shift.");
          return;
        }

        submitRequestBtn.disabled = true;
        submitRequestBtn.textContent = "Submitting...";

        try {
          await Promise.all(requests.map(createRequestedShift));

          submitRequestBtn.disabled = false;
          submitRequestBtn.textContent = "Submit Request";

          closeRequestModal();
          await loadRequestedShifts();
          await loadAllUserShifts();
        } catch (error) {
          console.error(error);

          submitRequestBtn.disabled = false;
          submitRequestBtn.textContent = "Submit Request";

          alert("Something went wrong submitting the request.");
        }
      });

      requestsTab.addEventListener("click", showRequestsTab);

      function showAllShiftsTab() {
        allShiftsTab.classList.add("tab-active");
        needConfirmationTab.classList.remove("tab-active");
        requestsTab.classList.remove("tab-active");

        allShiftsList.classList.remove("hidden");
        needConfirmationList.classList.add("hidden");
        requestsPanel.classList.add("hidden");
      }

      function showNeedConfirmationTab() {
        needConfirmationTab.classList.add("tab-active");
        allShiftsTab.classList.remove("tab-active");
        requestsTab.classList.remove("tab-active");

        needConfirmationList.classList.remove("hidden");
        allShiftsList.classList.add("hidden");
        requestsPanel.classList.add("hidden");

        loadNeedConfirmationShifts();
      }

      async function updateShiftStatus(recordId, status) {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          SCHEDULE_TABLE,
        )}/${recordId}`;

        const response = await fetch(url, {
          method: "PATCH",
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            fields: {
              shift_status: status,
            },
          }),
        });

        if (!response.ok) {
          throw new Error("Failed to update shift status");
        }

        return response.json();
      }

      async function fetchNeedConfirmationShifts() {
        const allShifts = await fetchAllUserShifts();

        return allShifts.filter((record) => {
          return (
            (record.fields.shift_status || "Unconfirmed") === "Unconfirmed"
          );
        });
      }

      function renderNeedConfirmationShifts(records) {
        if (records.length === 0) {
          needConfirmationList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase opacity-60">
        No shifts need confirmation.
      </div>
    `;
          return;
        }

        needConfirmationList.innerHTML = records
          .map((record) => {
            const fields = record.fields;

            return `
        <div class="px-8 py-4 flex items-center gap-6">
          <div class="flex-1">
            <h1 class="uppercase font-bold text-sm text-primary">
              ${formatShiftDate(fields.shift_start)}
            </h1>
            <p class="text-sm opacity-60">
              ${formatShiftTime(fields.shift_start)} - ${formatShiftTime(fields.shift_end)}
            </p>
          </div>

          <button
            class="confirm-shift-btn btn btn-sm rounded-full bg-primary text-base-100 border-0 shadow-none uppercase font-bold"
            data-record-id="${record.id}"
          >
            Confirm
          </button>
        </div>
      `;
          })
          .join("");
      }

      async function loadNeedConfirmationShifts() {
        try {
          const records = await fetchNeedConfirmationShifts();
          renderNeedConfirmationShifts(records);
        } catch (error) {
          console.error(error);

          needConfirmationList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase text-error font-bold">
        Something went wrong loading shifts.
      </div>
    `;
        }
      }

      document.addEventListener("click", async (event) => {
        const confirmBtn = event.target.closest(".confirm-shift-btn");
        if (!confirmBtn) return;

        confirmBtn.disabled = true;
        confirmBtn.textContent = "Confirming...";

        try {
          await updateShiftStatus(confirmBtn.dataset.recordId, "Confirmed");
          await loadNeedConfirmationShifts();
          await loadAllUserShifts();
        } catch (error) {
          console.error(error);
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Confirm";
          alert("Something went wrong confirming this shift.");
        }
      });

      allShiftsTab.addEventListener("click", showAllShiftsTab);
      needConfirmationTab.addEventListener("click", showNeedConfirmationTab);

      async function fetchAllUserShifts() {
        const user = await fetchUser();
        const linkedWorkstudies = user.linked_workstudy || [];

        if (
          !Array.isArray(linkedWorkstudies) ||
          linkedWorkstudies.length === 0
        ) {
          return [];
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          SCHEDULE_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch schedule records");
        }

        const data = await response.json();

        return data.records
          .filter((record) => {
            const workstudyIds = record.fields.workstudy_name || [];

            return workstudyIds.some((id) => linkedWorkstudies.includes(id));
          })
          .sort((a, b) => {
            return (
              new Date(b.fields.shift_start) - new Date(a.fields.shift_start)
            );
          });
      }

      function renderAllShifts(records) {
        if (records.length === 0) {
          allShiftsList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase opacity-60">
        No shifts found.
      </div>
    `;
          return;
        }

        allShiftsList.innerHTML = records
          .map((record) => {
            const fields = record.fields;

            return `
        <div class="px-8 py-4 flex items-center gap-6">
          <div class="flex-1">
            <h1 class="uppercase font-bold text-sm text-primary">
              ${formatShiftDate(fields.shift_start)}
            </h1>
            <p class="text-sm opacity-60">
              ${formatShiftTime(fields.shift_start)} - ${formatShiftTime(fields.shift_end)}
            </p>
          </div>

<span class="rounded-full px-4 py-1 text-xs uppercase ${
              fields.shift_status === "Confirmed"
                ? "bg-primary text-base-100"
                : fields.shift_status === "Requested"
                  ? "bg-sky-400 text-base-100"
                  : fields.shift_status === "Call Out"
                    ? "bg-red-400 text-base-100"
                    : "bg-amber-400 text-neutral"
            }">
  ${fields.shift_status || "Unconfirmed"}
</span>
        </div>
      `;
          })
          .join("");
      }

      async function loadAllUserShifts() {
        try {
          const records = await fetchAllUserShifts();
          renderAllShifts(records);
        } catch (error) {
          console.error(error);

          allShiftsList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase text-error font-bold">
        Something went wrong loading shifts.
      </div>
    `;
        }
      }

      async function fetchUser() {
        if (!userId) {
          window.location.href = "login.html";
          return;
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${USERS_TABLE}/${userId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch user");
        }

        const data = await response.json();
        return data.fields;
      }

      async function fetchRole(roleId) {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${ROLES_TABLE}/${roleId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) return "Role";

        const data = await response.json();
        return data.fields.name || "Role";
      }

      const SCHEDULE_TABLE = "Schedule";

      function formatShiftDate(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return "";

        return date.toLocaleDateString("en-US", {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }

      function formatShiftTime(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return "";

        return date.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        });
      }

      async function loadUserHeader() {
        try {
          const user = await fetchUser();

          avatarEl.src =
            user.avatar_url ||
            "https://img.daisyui.com/images/profile/demo/yellingcat@192.webp";

          nameEl.textContent = user.display_name || "User";

          if (user.role && user.role.length > 0) {
            roleEl.textContent = await fetchRole(user.role[0]);
          } else {
            roleEl.textContent = "Standard";
          }
        } catch (err) {
          console.error(err);
        }
      }

      loadUserHeader();
      loadAllUserShifts();
      loadNeedConfirmationShifts();
      showNeedConfirmationTab();
    </script>
  </body>
</html>
