<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />
    <!--tailwind-->
    <link href="src/output.css" rel="stylesheet" />
    <!--icons-->
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
  </head>
  <body class="h-screen overflow-hidden">
    <!--main container-->
    <div class="h-screen bg-neutral-100 flex overflow-hidden">
      <!--sidebar-->
      <div id="sidebar"></div>
      <!--right-->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!--header-->
        <div id="header"></div>
        <!--content-->
        <div class="p-8 flex-1 overflow-y-auto min-h-0">
          <div
            class="bg-base-100 shadow-md rounded-lg px-8 py-10 bg-linear-to-bl from-[#f3f520] to-[#4DB900] text-base-100 from-10% flex flex-col gap-2"
          >
            <h1 class="uppercase font-bold text-2xl">
              Welcome, <span id="display_name">Username</span>
            </h1>
            <h2 class="font-semibold uppercase text-sm">
              Access Workstudy Scheduling, Inventory Management and more
            </h2>
          </div>
          <div class="grid xl:grid-cols-[2fr_1fr] gap-8 mt-8">
            <!--left column-->
            <div class="flex flex-col gap-8 min-w-0">
              <!--stats-->
              <div class="stats shadow-md">
                <div class="stat bg-base-100">
                  <div class="stat-title uppercase">Active Workstudies</div>
                  <div id="activeWorkstudiesCount" class="stat-value text-4xl">
                    00
                  </div>
                </div>
                <div class="stat bg-base-100">
                  <div class="stat-title uppercase">Current Applicants</div>
                  <div id="applicantsCount" class="stat-value text-4xl">00</div>
                </div>
                <div class="stat bg-base-100">
                  <div class="stat-title uppercase">Low Stock Items</div>
                  <div class="stat-value text-4xl">00</div>
                </div>
              </div>
              <!--todays schedule card-->
              <div class="bg-base-100 shadow-md rounded-lg flex flex-col">
                <div
                  class="flex items-center justify-between px-8 py-4 border-b border-neutral-100"
                >
                  <h1 class="text-md uppercase font-bold">Today's Schedule</h1>
                  <a class="btn btn-xs btn-circle bg-primary text-base-100"
                    >+</a
                  >
                </div>
                <div id="todaysScheduleList" class="flex flex-col"></div>
                <div class="inset-shadow-sm px-8 py-4">
                  <a
                    href="schedule-calendar.html"
                    class="text-xs font-bold uppercase text-primary"
                    >View Calendar</a
                  >
                </div>
              </div>
              <!--announcements card-->
              <div class="bg-base-100 shadow-md rounded-lg flex flex-col">
                <div
                  class="flex items-center justify-between px-8 py-4 border-b border-neutral-100"
                >
                  <h1 class="text-md uppercase font-bold">
                    Latest Announcements
                  </h1>
                  <a class="btn btn-xs btn-circle bg-primary text-base-100"
                    >+</a
                  >
                </div>
                <div
                  id="announcementsList"
                  class="px-8 py-4 flex flex-col"
                ></div>
                <div class="inset-shadow-sm px-8 py-4">
                  <a
                    href="announcements.html"
                    class="text-xs font-bold uppercase text-primary"
                    >View All</a
                  >
                </div>
              </div>
            </div>
            <!--right column-->
            <div>
              <!--to do card-->
              <div class="bg-base-100 shadow-md rounded-lg flex flex-col">
                <div
                  class="flex items-center justify-between px-8 py-4 border-b border-neutral-100"
                >
                  <h1 class="text-md uppercase font-bold">My To-Dos</h1>
                  <a class="btn btn-xs btn-circle bg-primary text-base-100"
                    >+</a
                  >
                </div>
                <div class="flex flex-col">
                  <!--to do line item-->
                  <div class="px-8 py-4 flex items-center gap-4">
                    <h1 class="uppercase font-bold text-sm flex-1">
                      List Item
                    </h1>
                    <input
                      type="checkbox"
                      class="checkbox checkbox-sm rounded-full"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="src/components.js"></script>
    <script>
      const AIRTABLE_TOKEN =
        "path5D1SLsZnikHyD.8e47f28d9b3b2913d1ebf07e9b1beb8c0903a82bb49266f19cb98fb4021b0129";
      const BASE_ID = "appYqZMGk18beV4qI";
      const USERS_TABLE = "Users";

      const userId = localStorage.getItem("cpoUserId");

      const ACTIVE_WORKSTUDIES_TABLE = "Active Workstudies";
      const activeWorkstudiesCountEl = document.getElementById(
        "activeWorkstudiesCount",
      );

      const APPLICANTS_TABLE = "Applicants";
      const applicantsCountEl = document.getElementById("applicantsCount");

      const ANNOUNCEMENTS_TABLE = "Announcements";
      const announcementsListEl = document.getElementById("announcementsList");

      const SCHEDULE_TABLE = "Schedule";
      const todaysScheduleList = document.getElementById("todaysScheduleList");
      let workstudyMap = {};

      loadComponent("sidebar", "components/sidebar.html");

      loadComponent("header", "components/header.html", () => {
        loadUserHeader();
      });

      function setActiveNav() {
        const currentPage = window.location.pathname.split("/").pop();

        const links = document.querySelectorAll("[data-page]");

        links.forEach((link) => {
          if (link.dataset.page === currentPage) {
            link.classList.add("navActive");

            // 👇 If inside a <details>, open it
            const details = link.closest("details");
            if (details) {
              details.open = true;
            }
          }
        });
      }

      function formatTime(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return "";

        return date.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function getWorkstudyName(fields) {
        const ids = fields.workstudy_name;
        if (!Array.isArray(ids) || ids.length === 0) return "Unassigned";

        return ids.map((id) => workstudyMap[id] || "Unknown").join(", ");
      }

      function isToday(dateString) {
        const date = new Date(dateString);
        const today = new Date();

        return (
          date.getFullYear() === today.getFullYear() &&
          date.getMonth() === today.getMonth() &&
          date.getDate() === today.getDate()
        );
      }

      async function fetchWorkstudyMap() {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          ACTIVE_WORKSTUDIES_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` },
        });

        const data = await response.json();

        workstudyMap = {};
        data.records.forEach((r) => {
          workstudyMap[r.id] = r.fields.Name || "Unnamed";
        });
      }

      async function loadTodaysSchedule() {
        try {
          await fetchWorkstudyMap();

          const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
            SCHEDULE_TABLE,
          )}`;

          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` },
          });

          const data = await response.json();

          const todaysShifts = data.records
            .filter((record) => {
              const f = record.fields;
              if (!f.shift_start) return false;
              return isToday(f.shift_start);
            })
            .sort((a, b) => {
              return (
                new Date(a.fields.shift_start) - new Date(b.fields.shift_start)
              );
            });

          if (todaysShifts.length === 0) {
            todaysScheduleList.innerHTML = `
        <div class="px-8 py-4 text-xs uppercase opacity-60">
          No shifts scheduled today
        </div>
      `;
            return;
          }

          todaysScheduleList.innerHTML = todaysShifts
            .map((record) => {
              const f = record.fields;

              return `
        <div class="px-8 py-4 flex items-center gap-8">
          <span class="rounded-full bg-primary/10 size-10 flex items-center justify-center">
            <i class="fi fi-br-clock pt-1"></i>
          </span>

          <h1 class="text-sm uppercase font-bold">
            ${getWorkstudyName(f)}
          </h1>

          <h1 class="text-sm opacity-60 flex-1">
            ${formatTime(f.shift_start)} - ${formatTime(f.shift_end)}
          </h1>

          <span class="px-4 py-1 rounded-full text-xs uppercase font-bold ${
            f.shift_status === "Confirmed"
              ? "bg-primary text-base-100"
              : "bg-amber-400 text-neutral"
          }">
            ${f.shift_status || "Unconfirmed"}
          </span>
        </div>
      `;
            })
            .join("");
        } catch (err) {
          console.error(err);

          todaysScheduleList.innerHTML = `
      <div class="px-8 py-4 text-xs uppercase text-error">
        Failed to load schedule
      </div>
    `;
        }
      }

      function formatAnnouncementDate(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return "";

        return date.toLocaleDateString("en-US", {
          month: "2-digit",
          day: "2-digit",
          year: "2-digit",
        });
      }

      async function loadAnnouncements() {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          ANNOUNCEMENTS_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch announcements");
        }

        const data = await response.json();

        // sort newest first by created_at
        const sorted = data.records.sort((a, b) => {
          return new Date(b.fields.created_at) - new Date(a.fields.created_at);
        });

        // take top 3
        const topThree = sorted.slice(0, 3);

        if (topThree.length === 0) {
          announcementsListEl.innerHTML = `
      <p class="text-xs uppercase opacity-60">No announcements</p>
    `;
          return;
        }

        announcementsListEl.innerHTML = topThree
          .map((record) => {
            const fields = record.fields;

            return `
        <div class="flex items-center gap-8 w-full">
          <span class="rounded-full bg-primary/10 size-10 flex items-center justify-center">
            <i class="fi fi-br-megaphone-sound-waves pt-1"></i>
          </span>

          <div class="flex flex-col gap-1 flex-1">
            <h1 class="uppercase font-semibold text-sm">
              ${fields.title || "Untitled"}
            </h1>
            <h2 class="text-xs opacity-60">
              ${formatAnnouncementDate(fields.created_at)}
            </h2>
          </div>

          <i class="fi fi-br-angle-small-right pt-1"></i>
        </div>
      `;
          })
          .join("");
      }

      async function loadApplicantsCount() {
        const formula = `AND(
    {status} != "Potential Applicant",
    {status} != "Hired",
    {status} != "Other",
    {status} != "Not Moving Forward"
  )`;

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          APPLICANTS_TABLE,
        )}?filterByFormula=${encodeURIComponent(formula)}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch applicants");
        }

        const data = await response.json();
        applicantsCountEl.textContent = data.records.length;
      }

      async function loadActiveWorkstudiesCount() {
        const formula = `AND(
    {status} != "Terminated - Graduated",
    {status} != "Terminated - Involuntary"
  )`;

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          ACTIVE_WORKSTUDIES_TABLE,
        )}?filterByFormula=${encodeURIComponent(formula)}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch active workstudies");
        }

        const data = await response.json();
        activeWorkstudiesCountEl.textContent = data.records.length;
      }

      async function fetchUser() {
        if (!userId) {
          window.location.href = "auth.html"; // redirect if not logged in
          return;
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          USERS_TABLE,
        )}/${userId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch user");
        }

        const data = await response.json();
        return data.fields;
      }
      async function loadUserHeader() {
        const avatarEl = document.getElementById("userAvatar");
        const nameEl = document.getElementById("userName");
        const roleEl = document.getElementById("userRole");
        const displayNameSpan = document.getElementById("display_name");

        try {
          const user = await fetchUser();

          avatarEl.src =
            user.avatar_url ||
            "https://img.daisyui.com/images/profile/demo/yellingcat@192.webp";

          nameEl.textContent = user.display_name || "User";

          if (displayNameSpan) {
            displayNameSpan.textContent = user.display_name || "User";
          }

          if (user.role && user.role.length > 0) {
            roleEl.textContent = "Loading...";
            await loadRoleName(user.role[0]);
          } else {
            roleEl.textContent = "Standard";
          }
        } catch (err) {
          console.error(err);
        }
      }

      async function loadRoleName(roleRecordId) {
        const roleEl = document.getElementById("userRole");

        const url = `https://api.airtable.com/v0/${BASE_ID}/Roles/${roleRecordId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          roleEl.textContent = "Role";
          return;
        }

        const data = await response.json();
        roleEl.textContent = data.fields.name || "Role";
      }

      loadComponent("sidebar", "components/sidebar.html", () => {
        setActiveNav();
      });

      loadComponent("header", "components/header.html", () => {
        loadUserHeader();
      });

      const logoutBtn = document.getElementById("logoutBtn");

      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("cpoUserId");
          localStorage.removeItem("cpoUserEmail");
          localStorage.removeItem("cpoDisplayName");
        });
      }

      loadActiveWorkstudiesCount();
      loadApplicantsCount();
      loadAnnouncements();
      loadTodaysSchedule();
    </script>
  </body>
</html>
