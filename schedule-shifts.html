<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPO Portal</title>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind -->
    <link href="src/output.css" rel="stylesheet" />

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
  </head>

  <body class="h-screen overflow-hidden font-[Google_Sans_Flex]">
    <!-- main container -->
    <div class="h-screen bg-neutral-100 flex overflow-hidden">
      <!-- SIDEBAR -->
      <div id="sidebar"></div>

      <!-- RIGHT SIDE -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- HEADER -->
        <div id="header"></div>

        <!-- CONTENT -->
        <div class="p-8 flex flex-col flex-1 overflow-hidden min-h-0">
          <!-- GREEN TITLE BAR -->
          <div
            class="bg-base-100 shadow-md rounded-lg px-8 py-4 bg-linear-to-bl from-[#f3f520] to-[#4DB900] text-base-100 flex items-center justify-between"
          >
            <h1 class="uppercase font-black text-2xl">Scheduled Shifts</h1>
            <div class="flex gap-4 items-center">
              <button
                class="btn btn-sm rounded-full bg-base-100 border-0 shadow-none px-6 py-1"
              >
                + Add Shift
              </button>
              <div class="dropdown dropdown-end">
                <div
                  tabindex="0"
                  role="button"
                  class="btn text-xl bg-transparent border-0 shadow-none text-base-100"
                >
                  <i class="fi fi-br-menu-dots-vertical pt-1"></i>
                </div>
                <ul
                  tabindex="-1"
                  class="dropdown-content mt-2 menu bg-base-100 border border-primary text-neutral rounded-box z-1 w-60 p-2 shadow-sm text-xs"
                >
                  <li>
                    <a
                      id="requestConfirmationBtn"
                      class="hover:text-primary hover:bg-transparent font-bold uppercase"
                    >
                      Request Confirmation
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <div class="mt-4">
            <label class="input w-full rounded-lg bg-base-100 shadow-md h-12">
              <i class="fi fi-br-search opacity-50 pt-1"></i>
              <input
                id="shiftSearchInput"
                type="search"
                class="grow"
                placeholder="Search by name, date, or type..."
              />
            </label>
          </div>

          <div class="mt-4 flex gap-4 items-center flex-wrap">
            <!-- Mode Select -->
            <select id="filterMode" class="select select-bordered">
              <option value="all">All</option>
              <option value="between">Between</option>
              <option value="status">Status</option>
            </select>

            <!-- Date Range -->
            <div id="betweenFilters" class="hidden flex gap-2 items-center">
              <input id="startDate" type="date" class="input input-bordered" />
              <span class="text-xs opacity-60 uppercase">to</span>
              <input id="endDate" type="date" class="input input-bordered" />
            </div>

            <!-- Status Filter -->
            <div id="statusFilterWrap" class="hidden">
              <select id="statusFilter" class="select select-bordered">
                <option value="">All Statuses</option>
                <option value="Unconfirmed">Unconfirmed</option>
                <option value="Confirmed">Confirmed</option>
              </select>
            </div>
          </div>

          <div class="mt-4 flex-1 min-h-0">
            <div
              class="bg-base-100 rounded-lg shadow-md overflow-hidden h-full flex flex-col"
            >
              <div class="overflow-auto flex-1 min-h-0">
                <table class="table">
                  <thead class="sticky top-0 bg-base-100 z-10">
                    <tr class="uppercase text-xs">
                      <th>Workstudy</th>
                      <th>Date</th>
                      <th>Start</th>
                      <th>End</th>
                      <th>Type</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="shiftsTableBody">
                    <tr>
                      <td colspan="6" class="uppercase text-xs opacity-60">
                        Loading shifts...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div
      id="requestConfirmModal"
      class="hidden fixed inset-0 z-[9999] bg-black/40 items-center justify-center p-6"
    >
      <div
        class="bg-base-100 rounded-xl shadow-xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden"
      >
        <div class="p-6 border-b border-neutral-200 shrink-0 w-full">
          <h3 class="font-black text-2xl uppercase">
            Request Schedule Confirmations
          </h3>
          <p class="text-sm opacity-60 mt-1">
            Select which users to request a schedule confirmation from.
          </p>
        </div>

        <!-- Step 1: Date Range -->
        <div id="requestConfirmDateStep" class="p-6 flex-1 w-full">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="label font-bold uppercase text-xs"
                >Start Date</label
              >
              <input
                id="requestStartDate"
                type="date"
                class="input input-bordered w-full"
              />
            </div>

            <div>
              <label class="label font-bold uppercase text-xs">End Date</label>
              <input
                id="requestEndDate"
                type="date"
                class="input input-bordered w-full"
              />
            </div>
          </div>
        </div>

        <!-- Step 2: Grouped List -->
        <div
          id="requestConfirmListStep"
          class="hidden flex-1 min-h-0 w-full flex flex-col"
        >
          <div class="px-6 py-3 border-b border-neutral-200 flex justify-end">
            <button id="selectAllRequestBtn" class="btn btn-sm rounded-full">
              Select All
            </button>
          </div>

          <div
            id="requestConfirmList"
            class="p-6 flex-1 min-h-0 overflow-y-auto flex flex-col gap-4 w-full"
          ></div>
        </div>

        <div
          class="p-6 border-t border-neutral-200 flex justify-end gap-3 shrink-0 w-full"
        >
          <button id="closeRequestConfirmBtn" class="btn">Cancel</button>
          <button id="backRequestConfirmBtn" class="btn hidden">Back</button>
          <button
            id="nextRequestConfirmBtn"
            class="btn bg-neutral text-base-100"
          >
            Next
          </button>
          <button
            id="submitRequestConfirmBtn"
            class="btn bg-neutral text-base-100 hidden"
          >
            Submit
          </button>
        </div>
      </div>
    </div>
    <script src="src/components.js"></script>

    <!-- SCRIPT -->
    <script>
      const AIRTABLE_TOKEN =
        "path5D1SLsZnikHyD.8e47f28d9b3b2913d1ebf07e9b1beb8c0903a82bb49266f19cb98fb4021b0129";
      const BASE_ID = "appYqZMGk18beV4qI";

      const USERS_TABLE = "Users";
      const ROLES_TABLE = "Roles";

      const userId = localStorage.getItem("cpoUserId");

      const avatarEl = document.getElementById("userAvatar");
      const nameEl = document.getElementById("userName");
      const roleEl = document.getElementById("userRole");

      const shiftSearchInput = document.getElementById("shiftSearchInput");
      let allShiftRecords = [];

      const filterMode = document.getElementById("filterMode");
      const betweenFilters = document.getElementById("betweenFilters");
      const statusFilterWrap = document.getElementById("statusFilterWrap");

      const startDateInput = document.getElementById("startDate");
      const endDateInput = document.getElementById("endDate");
      const statusFilter = document.getElementById("statusFilter");

      const requestConfirmationBtn = document.getElementById(
        "requestConfirmationBtn",
      );

      requestConfirmationBtn.addEventListener("click", () => {
        requestStartDate.value = "";
        requestEndDate.value = "";
        requestConfirmList.innerHTML = "";

        showRequestDateStep();

        requestConfirmModal.classList.remove("hidden");
        requestConfirmModal.classList.add("flex");
      });
      const requestConfirmModal = document.getElementById(
        "requestConfirmModal",
      );
      const requestConfirmList = document.getElementById("requestConfirmList");
      const closeRequestConfirmBtn = document.getElementById(
        "closeRequestConfirmBtn",
      );
      const submitRequestConfirmBtn = document.getElementById(
        "submitRequestConfirmBtn",
      );

      const requestConfirmDateStep = document.getElementById(
        "requestConfirmDateStep",
      );
      const requestConfirmListStep = document.getElementById(
        "requestConfirmListStep",
      );
      const requestStartDate = document.getElementById("requestStartDate");
      const requestEndDate = document.getElementById("requestEndDate");
      const nextRequestConfirmBtn = document.getElementById(
        "nextRequestConfirmBtn",
      );
      const backRequestConfirmBtn = document.getElementById(
        "backRequestConfirmBtn",
      );
      const selectAllRequestBtn = document.getElementById(
        "selectAllRequestBtn",
      );

      const TODO_TABLE = "To Do";

      function setActiveNav() {
        const currentPage = window.location.pathname.split("/").pop();

        const links = document.querySelectorAll("[data-page]");

        links.forEach((link) => {
          if (link.dataset.page === currentPage) {
            link.classList.add("navSubActive");

            // 👇 If inside a <details>, open it
            const details = link.closest("details");
            if (details) {
              details.open = true;
            }
          }
        });
      }

      async function loadUserHeader() {
        const avatarEl = document.getElementById("userAvatar");
        const nameEl = document.getElementById("userName");
        const roleEl = document.getElementById("userRole");

        const user = await fetchUser();

        avatarEl.src =
          user.avatar_url ||
          "https://img.daisyui.com/images/profile/demo/yellingcat@192.webp";

        nameEl.textContent = user.display_name || "User";

        if (user.role && user.role.length > 0) {
          roleEl.textContent = "Loading...";
          await loadRoleName(user.role[0]);
        } else {
          roleEl.textContent = "Standard";
        }
      }

      async function fetchUsersRecords() {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          USERS_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch users");
        }

        const data = await response.json();
        return data.records;
      }

      async function createToDoRecord({ userId, startDate, endDate }) {
        const confirmationUrl = "student-schedule.html";

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          TODO_TABLE,
        )}`;

        const response = await fetch(url, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            fields: {
              user: [userId],
              title: "Schedule Confirmation Requested",
              description: `Click Here to confirm your schedule for ${formatDate(
                startDate,
              )} - ${formatDate(endDate)}`,
              completed: false,
              confirmation_link: confirmationUrl,
            },
          }),
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error(errorText);
          throw new Error("Failed to create To Do record");
        }

        return response.json();
      }

      function findUserByWorkstudyId(users, workstudyId) {
        return users.find((userRecord) => {
          const linkedWorkstudies = userRecord.fields.linked_workstudy;

          return (
            Array.isArray(linkedWorkstudies) &&
            linkedWorkstudies.includes(workstudyId)
          );
        });
      }

      function showRequestDateStep() {
        requestConfirmDateStep.classList.remove("hidden");
        requestConfirmListStep.classList.add("hidden");

        nextRequestConfirmBtn.classList.remove("hidden");
        backRequestConfirmBtn.classList.add("hidden");
        submitRequestConfirmBtn.classList.add("hidden");
      }

      function showRequestListStep() {
        requestConfirmDateStep.classList.add("hidden");
        requestConfirmListStep.classList.remove("hidden");

        nextRequestConfirmBtn.classList.add("hidden");
        backRequestConfirmBtn.classList.remove("hidden");
        submitRequestConfirmBtn.classList.remove("hidden");
      }

      function isShiftBetweenDates(record, startValue, endValue) {
        const shiftDate = new Date(record.fields.shift_start);
        const startDate = new Date(startValue + "T00:00:00");
        const endDate = new Date(endValue + "T23:59:59");

        return shiftDate >= startDate && shiftDate <= endDate;
      }

      requestConfirmationBtn.addEventListener("click", () => {
        renderRequestConfirmModal();
        requestConfirmModal.classList.remove("hidden");
        requestConfirmModal.classList.add("flex");
      });

      closeRequestConfirmBtn.addEventListener("click", () => {
        requestConfirmModal.classList.add("hidden");
        requestConfirmModal.classList.remove("flex");
      });

      submitRequestConfirmBtn.addEventListener("click", async () => {
        const selectedWorkstudies = Array.from(
          document.querySelectorAll(".request-user-checkbox:checked"),
        ).map((checkbox) => {
          return {
            name: checkbox.dataset.workstudyName,
            workstudyId: checkbox.dataset.workstudyId,
          };
        });

        if (selectedWorkstudies.length === 0) {
          alert("Please select at least one workstudy.");
          return;
        }

        submitRequestConfirmBtn.disabled = true;
        submitRequestConfirmBtn.textContent = "Creating...";

        try {
          const users = await fetchUsersRecords();

          const createRequests = selectedWorkstudies.map((workstudy) => {
            const matchingUser = findUserByWorkstudyId(
              users,
              workstudy.workstudyId,
            );

            if (!matchingUser) {
              console.warn(`No user found for ${workstudy.name}`);
              return null;
            }

            return createToDoRecord({
              userId: matchingUser.id,
              startDate: requestStartDate.value,
              endDate: requestEndDate.value,
            });
          });

          await Promise.all(createRequests.filter(Boolean));

          submitRequestConfirmBtn.disabled = false;
          submitRequestConfirmBtn.textContent = "Submit";

          requestConfirmModal.classList.add("hidden");
          requestConfirmModal.classList.remove("flex");

          alert("Schedule confirmation requests created.");
        } catch (error) {
          console.error(error);

          submitRequestConfirmBtn.disabled = false;
          submitRequestConfirmBtn.textContent = "Submit";

          alert("Something went wrong creating confirmation requests.");
        }
      });

      function getUnconfirmedGroups(startValue, endValue) {
        const groups = {};

        allShiftRecords.forEach((record) => {
          const fields = record.fields;

          if ((fields.shift_status || "Unconfirmed") !== "Unconfirmed") return;
          if (!isShiftBetweenDates(record, startValue, endValue)) return;

          const name = getWorkstudyName(fields);

          if (!groups[name]) groups[name] = [];
          groups[name].push(record);
        });

        return groups;
      }

      function renderRequestConfirmModal() {
        const groups = getUnconfirmedGroups(
          requestStartDate.value,
          requestEndDate.value,
        );
        const groupNames = Object.keys(groups).sort();

        if (groupNames.length === 0) {
          requestConfirmList.innerHTML = `
      <div class="bg-neutral-100 rounded-lg p-4">
        <p class="text-xs uppercase font-bold opacity-60">
          No unconfirmed shifts found.
        </p>
      </div>
    `;
          return;
        }

        requestConfirmList.innerHTML = groupNames
          .map((name) => {
            const records = groups[name];

            return `
<div class="border border-neutral-200 rounded-lg overflow-hidden shrink-0 w-full">
<label class="flex items-center gap-3 px-4 py-4 bg-neutral-100">
<input
  type="checkbox"
  class="checkbox checkbox-sm request-user-checkbox"
  data-workstudy-name="${name}"
  data-workstudy-id="${records[0].fields.workstudy_name[0]}"
/>
            <span class="font-black uppercase text-sm">${name}</span>
            <span class="text-xs opacity-60 uppercase">
              ${records.length} unconfirmed shift${records.length === 1 ? "" : "s"}
            </span>
          </label>

          <div class="divide-y divide-neutral-100">
            ${records
              .map((record) => {
                const f = record.fields;

                return `
                  <div class="px-4 py-3 flex items-center gap-4 text-sm uppercase">
                    <span class="font-bold w-32">${formatDate(f.shift_start)}</span>
                    <span class="opacity-60 flex-1">
                      ${formatTime(f.shift_start)} - ${formatTime(f.shift_end)}
                    </span>
                    <span class="rounded-full px-3 py-1 text-xs bg-amber-400 text-neutral">
                      ${f.shift_status || "Unconfirmed"}
                    </span>
                  </div>
                `;
              })
              .join("")}
          </div>
        </div>
      `;
          })
          .join("");
      }

      nextRequestConfirmBtn.addEventListener("click", () => {
        if (!requestStartDate.value || !requestEndDate.value) {
          alert("Please enter a start date and end date.");
          return;
        }

        renderRequestConfirmModal();
        showRequestListStep();
      });

      backRequestConfirmBtn.addEventListener("click", () => {
        showRequestDateStep();
      });

      selectAllRequestBtn.addEventListener("click", () => {
        const boxes = document.querySelectorAll(".request-user-checkbox");
        const shouldCheckAll = Array.from(boxes).some((box) => !box.checked);

        boxes.forEach((box) => {
          box.checked = shouldCheckAll;
        });

        selectAllRequestBtn.textContent = shouldCheckAll
          ? "Deselect All"
          : "Select All";
      });

      function updateFilterUI() {
        const mode = filterMode.value;

        betweenFilters.classList.toggle("hidden", mode !== "between");
        statusFilterWrap.classList.toggle("hidden", mode !== "status");
      }

      function filterShifts() {
        const searchTerm = shiftSearchInput.value.trim().toLowerCase();
        const mode = filterMode.value;

        let filtered = [...allShiftRecords];

        // 🔹 MODE FILTERING
        if (mode === "between") {
          const start = startDateInput.value;
          const end = endDateInput.value;

          if (start && end) {
            const startDate = new Date(start);
            const endDate = new Date(end);

            filtered = filtered.filter((record) => {
              const shiftDate = new Date(record.fields.shift_start);
              return shiftDate >= startDate && shiftDate <= endDate;
            });
          }
        }

        if (mode === "status") {
          const selectedStatus = statusFilter.value;

          if (selectedStatus) {
            filtered = filtered.filter(
              (record) => record.fields.shift_status === selectedStatus,
            );
          }
        }

        // 🔹 SEARCH FILTERING (applies on top of mode)
        if (searchTerm) {
          filtered = filtered.filter((record) => {
            const f = record.fields;

            const name = getWorkstudyName(f).toLowerCase();
            const date = formatDate(f.shift_start).toLowerCase();
            const start = formatTime(f.shift_start).toLowerCase();
            const end = formatTime(f.shift_end).toLowerCase();
            const type = String(f.shift_type || "").toLowerCase();
            const status = String(f.shift_status || "").toLowerCase();

            return (
              name.includes(searchTerm) ||
              date.includes(searchTerm) ||
              start.includes(searchTerm) ||
              end.includes(searchTerm) ||
              type.includes(searchTerm) ||
              status.includes(searchTerm)
            );
          });
        }

        renderShifts(filtered);
      }

      async function fetchUser() {
        if (!userId) {
          window.location.href = "login.html";
          return;
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${USERS_TABLE}/${userId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch user");
        }

        const data = await response.json();
        return data.fields;
      }

      async function fetchRole(roleId) {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${ROLES_TABLE}/${roleId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) return "Role";

        const data = await response.json();
        return data.fields.name || "Role";
      }

      const SCHEDULE_TABLE = "Schedule";
      const ACTIVE_WORKSTUDIES_TABLE = "Active Workstudies";
      const shiftsTableBody = document.getElementById("shiftsTableBody");

      let activeWorkstudyMap = {};

      function formatDate(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return "";

        return date.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }

      function formatTime(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return "";

        return date.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        });
      }

      async function fetchActiveWorkstudiesMap() {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          ACTIVE_WORKSTUDIES_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch active workstudies");
        }

        const data = await response.json();

        activeWorkstudyMap = {};
        data.records.forEach((record) => {
          activeWorkstudyMap[record.id] = record.fields.Name || "Unnamed";
        });
      }

      function getWorkstudyName(fields) {
        const linkedIds = fields.workstudy_name;

        if (!Array.isArray(linkedIds) || linkedIds.length === 0) {
          return "Unassigned";
        }

        return linkedIds
          .map((id) => activeWorkstudyMap[id] || "Unknown")
          .join(", ");
      }

      async function fetchScheduleRecords() {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          SCHEDULE_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch schedule records");
        }

        const data = await response.json();
        return data.records;
      }

      function renderShifts(records) {
        if (records.length === 0) {
          shiftsTableBody.innerHTML = `
      <tr>
        <td colspan="6" class="uppercase text-xs opacity-60">
          No scheduled shifts found.
        </td>
      </tr>
    `;
          return;
        }

        shiftsTableBody.innerHTML = records
          .map((record) => {
            const fields = record.fields;

            return `
        <tr class="uppercase text-sm">
          <td class="font-bold">${getWorkstudyName(fields)}</td>
          <td>${formatDate(fields.shift_start)}</td>
          <td>${formatTime(fields.shift_start)}</td>
          <td>${formatTime(fields.shift_end)}</td>
          <td>${fields.shift_type || ""}</td>
          <td>
            <span class="rounded-full px-4 py-1 text-xs ${
              fields.shift_status === "Confirmed"
                ? "bg-primary text-base-100 border-0"
                : "bg-amber-400 text-neutral border-0"
            }">
              ${fields.shift_status || "Unconfirmed"}
            </span>
          </td>
        </tr>
      `;
          })
          .join("");
      }

      async function loadShiftsTable() {
        try {
          await fetchActiveWorkstudiesMap();

          const records = await fetchScheduleRecords();

          records.sort((a, b) => {
            return (
              new Date(a.fields.shift_start) - new Date(b.fields.shift_start)
            );
          });

          allShiftRecords = records;
          renderShifts(allShiftRecords);
        } catch (error) {
          console.error(error);

          shiftsTableBody.innerHTML = `
      <tr>
        <td colspan="6" class="uppercase text-xs text-error font-bold">
          Something went wrong loading shifts.
        </td>
      </tr>
    `;
        }
      }
      async function loadRoleName(roleRecordId) {
        const roleEl = document.getElementById("userRole");

        const url = `https://api.airtable.com/v0/${BASE_ID}/Roles/${roleRecordId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          roleEl.textContent = "Role";
          return;
        }

        const data = await response.json();
        roleEl.textContent = data.fields.name || "Role";
      }

      filterMode.addEventListener("change", () => {
        updateFilterUI();
        filterShifts();
      });

      loadComponent("sidebar", "components/sidebar.html", () => {
        setActiveNav();
      });

      loadComponent("header", "components/header.html", () => {
        loadUserHeader();
      });
