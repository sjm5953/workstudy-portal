    <script>
      const AIRTABLE_TOKEN =
        "path5D1SLsZnikHyD.8e47f28d9b3b2913d1ebf07e9b1beb8c0903a82bb49266f19cb98fb4021b0129";
      const BASE_ID = "appYqZMGk18beV4qI";
      const SCHEDULE_TABLE = "Schedule";

      const calendarEl = document.getElementById("scheduleCalendar");
      const currentDayLabel = document.getElementById("currentDayLabel");
      const prevDayBtn = document.getElementById("prevDayBtn");
      const nextDayBtn = document.getElementById("nextDayBtn");
      const todayBtn = document.getElementById("todayBtn");

      let viewedDate = new Date();
      viewedDate.setHours(0, 0, 0, 0);

      const startHour = 7;
      const endHour = 20;
      const slotMinutes = 30;
      const labelColWidth = 0;
      const slotWidth = 64;

      const ACTIVE_WORKSTUDIES_TABLE = "Active Workstudies";
      const newShiftModal = document.getElementById("newShiftModal");
      const newShiftWorkstudy = document.getElementById("newShiftWorkstudy");
      const newShiftStart = document.getElementById("newShiftStart");
      const newShiftEnd = document.getElementById("newShiftEnd");
      const newShiftStatus = document.getElementById("newShiftStatus");
      const newShiftNotes = document.getElementById("newShiftNotes");
      const cancelNewShiftBtn = document.getElementById("cancelNewShiftBtn");
      const saveNewShiftBtn = document.getElementById("saveNewShiftBtn");
      let activeWorkstudyRecords = [];
      let dragStartX = null;
      let dragEndX = null;

      const draftContextMenu = document.getElementById("draftContextMenu");

      const USERS_TABLE = "Users";
      const userId = localStorage.getItem("cpoUserId");
      const avatarEl = document.getElementById("userAvatar");
      const nameEl = document.getElementById("userName");
      const roleEl = document.getElementById("userRole");

      function showDraftContextMenu(event, draftRow) {
        event.preventDefault();
        event.stopPropagation();

        dragStartX = null;
        dragEndX = null;
        resetDraftPreview();

        draftContextMenu.style.left = `${event.clientX}px`;
        draftContextMenu.style.top = `${event.clientY}px`;
        draftContextMenu.classList.remove("hidden");
      }

      function hideDraftContextMenu() {
        draftContextMenu.classList.add("hidden");
      }

      function resetDraftPreview() {
        const preview = document.getElementById("draftShiftPreview");
        const previewText = document.getElementById("draftShiftPreviewText");

        if (preview) {
          preview.classList.add("hidden");
          preview.classList.remove("flex");
          preview.style.left = "0px";
          preview.style.width = "0px";
        }

        if (previewText) {
          previewText.textContent = "New Shift";
        }

        dragStartX = null;
        dragEndX = null;
      }

      function formatDateForAirtable(date) {
        return date.toISOString().split("T")[0];
      }

      function formatDayLabel(date) {
        return date.toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",
        });
      }

      function formatTimeLabel(hour, minute) {
        const date = new Date();
        date.setHours(hour, minute, 0, 0);

        return date.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function formatShiftTime(dateString) {
        const date = new Date(dateString);

        return date.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function getMinutesFromStart(dateString) {
        const date = new Date(dateString);
        return (date.getHours() - startHour) * 60 + date.getMinutes();
      }

      function getSlots() {
        const slots = [];

        for (let hour = startHour; hour <= endHour; hour++) {
          for (let minute of [0, 30]) {
            if (hour === endHour && minute > 0) continue;

            slots.push({
              hour,
              minute,
              label: formatTimeLabel(hour, minute),
            });
          }
        }

        return slots;
      }

      async function fetchScheduleRecords() {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          SCHEDULE_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch schedule records.");
        }

        const data = await response.json();
        return data.records;
      }

      function getWorkstudyName(fields, workstudyMap) {
        const linkedIds = fields.workstudy_name;

        if (!Array.isArray(linkedIds) || linkedIds.length === 0) {
          return "Unassigned";
        }

        return linkedIds.map((id) => workstudyMap[id] || "Unknown").join(", ");
      }

      async function fetchActiveWorkstudiesMap() {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          ACTIVE_WORKSTUDIES_TABLE,
        )}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch active workstudies.");
        }

        const data = await response.json();

        activeWorkstudyRecords = data.records;

        const map = {};

        data.records.forEach((record) => {
          map[record.id] = record.fields.Name || "Unnamed";
        });

        return map;
      }

      function dateToLocalInputValue(date) {
        const offset = date.getTimezoneOffset();
        const localDate = new Date(date.getTime() - offset * 60000);
        return localDate.toISOString().slice(0, 16);
      }

      function roundToNearestSlot(minutes) {
        return Math.round(minutes / slotMinutes) * slotMinutes;
      }

      function minutesToDate(minutesFromStart) {
        const date = new Date(viewedDate);
        date.setHours(startHour, 0, 0, 0);
        date.setMinutes(date.getMinutes() + minutesFromStart);
        return date;
      }

      function xToMinutes(x) {
        const rawSlot = x / slotWidth;
        const rawMinutes = rawSlot * slotMinutes;

        const rounded = roundToNearestSlot(rawMinutes);

        const maxMinutes = (endHour - startHour) * 60;

        return Math.max(0, Math.min(rounded, maxMinutes));
      }

      function populateWorkstudySelect() {
        const sortedWorkstudies = [...activeWorkstudyRecords].sort((a, b) => {
          const nameA = a.fields.Name || "";

          const nameB = b.fields.Name || "";

          return nameA.localeCompare(nameB);
        });

        newShiftWorkstudy.innerHTML = sortedWorkstudies

          .map((record) => {
            return `

        <option value="${record.id}">

          ${record.fields.Name || "Unnamed"}

        </option>

      `;
          })

          .join("");
      }

      async function createShiftRecord() {
        const workstudyId = newShiftWorkstudy.value;

        const startDate = new Date(newShiftStart.value);
        const endDate = new Date(newShiftEnd.value);

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          SCHEDULE_TABLE,
        )}`;

        const response = await fetch(url, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            fields: {
              workstudy_name: [workstudyId],
              shift_start: startDate.toISOString(),
              shift_end: endDate.toISOString(),
              shift_status: newShiftStatus.value,
              notes: newShiftNotes.value.trim(),
            },
          }),
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error(errorText);
          throw new Error("Failed to create shift.");
        }

        return response.json();
      }

      function setupDraftShiftDrag() {
        const draftRow = document.getElementById("draftShiftRow");
        const preview = document.getElementById("draftShiftPreview");
        const previewText = document.getElementById("draftShiftPreviewText");

        if (!draftRow) return;

        draftRow.addEventListener("contextmenu", (event) => {
          showDraftContextMenu(event, draftRow);
        });

        draftRow.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          const rect = draftRow.getBoundingClientRect();
          dragStartX = event.clientX - rect.left;
          dragEndX = dragStartX;

          draftRow.setPointerCapture(event.pointerId);

          preview.classList.remove("hidden");
          preview.classList.add("flex");
        });

        function setQuickShiftTimes(template) {
          const startDate = new Date(viewedDate);
          const endDate = new Date(viewedDate);

          if (template === "morning") {
            startDate.setHours(7, 30, 0, 0);
            endDate.setHours(11, 30, 0, 0);
          }

          if (template === "afternoon") {
            startDate.setHours(10, 0, 0, 0);
            endDate.setHours(16, 0, 0, 0);
          }

          if (template === "evening") {
            startDate.setHours(14, 0, 0, 0);
            endDate.setHours(18, 0, 0, 0);
          }

          populateWorkstudySelect();

          newShiftStart.value = dateToLocalInputValue(startDate);
          newShiftEnd.value = dateToLocalInputValue(endDate);
          newShiftStatus.value = "Unconfirmed";
          newShiftNotes.value = "";

          newShiftModal.showModal();
        }

        draftRow.addEventListener("pointermove", (event) => {
          if (dragStartX === null) return;

          const rect = draftRow.getBoundingClientRect();
          dragEndX = event.clientX - rect.left;

          const startX = Math.min(dragStartX, dragEndX);
          const endX = Math.max(dragStartX, dragEndX);

          const startMinutes = xToMinutes(startX);
          const endMinutes = Math.max(
            startMinutes + slotMinutes,
            xToMinutes(endX),
          );

          const left = (startMinutes / slotMinutes) * slotWidth;
          const width = ((endMinutes - startMinutes) / slotMinutes) * slotWidth;

          const startDate = minutesToDate(startMinutes);
          const endDate = minutesToDate(endMinutes);

          preview.style.left = `${left}px`;
          preview.style.width = `${width}px`;
          previewText.textContent = `${formatShiftTime(startDate)} - ${formatShiftTime(endDate)}`;
        });

        draftRow.addEventListener("pointerup", (event) => {
          if (dragStartX === null || dragEndX === null) return;

          const startX = Math.min(dragStartX, dragEndX);
          const endX = Math.max(dragStartX, dragEndX);

          const startMinutes = xToMinutes(startX);
          const endMinutes = Math.max(
            startMinutes + slotMinutes,
            xToMinutes(endX),
          );

          const startDate = minutesToDate(startMinutes);
          const endDate = minutesToDate(endMinutes);

          dragStartX = null;
          dragEndX = null;

          populateWorkstudySelect();

          newShiftStart.value = dateToLocalInputValue(startDate);
          newShiftEnd.value = dateToLocalInputValue(endDate);
          newShiftStatus.value = "Unconfirmed";
          newShiftNotes.value = "";

          newShiftModal.showModal();
        });
      }

      function setQuickShiftTimes(template) {
        const startDate = new Date(viewedDate);
        const endDate = new Date(viewedDate);

        if (template === "morning") {
          startDate.setHours(7, 30, 0, 0);
          endDate.setHours(11, 30, 0, 0);
        }

        if (template === "afternoon") {
          startDate.setHours(10, 0, 0, 0);
          endDate.setHours(16, 0, 0, 0);
        }

        if (template === "evening") {
          startDate.setHours(14, 0, 0, 0);
          endDate.setHours(18, 0, 0, 0);
        }

        populateWorkstudySelect();

        newShiftStart.value = dateToLocalInputValue(startDate);
        newShiftEnd.value = dateToLocalInputValue(endDate);
        newShiftStatus.value = "Unconfirmed";
        newShiftNotes.value = "";

        newShiftModal.showModal();
      }

      document.addEventListener("click", (event) => {
        const quickOption = event.target.closest(".quick-shift-option");

        if (quickOption) {
          hideDraftContextMenu();
          setQuickShiftTimes(quickOption.dataset.shiftTemplate);
          return;
        }

        if (!draftContextMenu.contains(event.target)) {
          hideDraftContextMenu();
        }
      });

      cancelNewShiftBtn.addEventListener("click", () => {
        newShiftModal.close();
        resetDraftPreview();
      });

      saveNewShiftBtn.addEventListener("click", async () => {
        if (
          !newShiftWorkstudy.value ||
          !newShiftStart.value ||
          !newShiftEnd.value
        ) {
          alert("Please fill out the required shift fields.");
          return;
        }

        saveNewShiftBtn.disabled = true;
        saveNewShiftBtn.textContent = "Saving...";

        try {
          await createShiftRecord();

          newShiftModal.close();
          resetDraftPreview();

          saveNewShiftBtn.disabled = false;
          saveNewShiftBtn.textContent = "Save Shift";

          await loadDaySchedule();
        } catch (error) {
          console.error(error);

          saveNewShiftBtn.disabled = false;
          saveNewShiftBtn.textContent = "Save Shift";

          alert("Something went wrong creating the shift.");
        }
      });

      function renderCalendar(shifts, workstudyMap) {
        const slots = getSlots();
        const totalSlots = slots.length;
        const gridWidth = totalSlots * slotWidth;
        const rowHeight = 64;

        const draftRow = `
  <div
    id="draftShiftRow"
    class="relative border-b border-neutral-100 bg-neutral-50 cursor-crosshair"
    style="height:${rowHeight}px; width:${gridWidth}px;"
  >
    <div
      class="relative h-full"
      style="
        background-image: linear-gradient(to right, rgba(0,0,0,.08) 1px, transparent 1px);
        background-size: ${slotWidth}px 100%;
      "
    >
      <div class="absolute inset-0 flex items-center px-4 pointer-events-none">
        <span class="text-xs font-black uppercase opacity-40">
          Drag here to create a new shift
        </span>
      </div>

      <div
        id="draftShiftPreview"
        class="hidden absolute top-3 h-10 rounded-full bg-neutral text-base-100 px-4 items-center shadow-sm pointer-events-none"
      >
        <span id="draftShiftPreviewText" class="text-xs font-black uppercase truncate">
          New Shift
        </span>
      </div>
    </div>
  </div>
`;

        currentDayLabel.textContent = formatDayLabel(viewedDate);

        const noShiftsMessage =
          shifts.length === 0
            ? `
      <div class="p-6 border-b border-neutral-100">
        <p class="uppercase text-sm font-bold opacity-60">
          No shifts scheduled for this day.
        </p>
      </div>
    `
            : "";

        const rows = shifts.map((record) => {
          const fields = record.fields;

          const name = getWorkstudyName(fields, workstudyMap);
          const start = new Date(fields.shift_start);
          const end = new Date(fields.shift_end);

          const leftMinutes = Math.max(
            0,
            getMinutesFromStart(fields.shift_start),
          );
          const durationMinutes = Math.max(30, (end - start) / 60000);

          const left = (leftMinutes / slotMinutes) * slotWidth;
          const width = (durationMinutes / slotMinutes) * slotWidth;

          const status = fields.shift_status || "Unconfirmed";

          const barColorClass =
            status === "Confirmed"
              ? "bg-primary text-base-100"
              : "bg-amber-400 text-neutral";

          return `
  <div
    class="relative border-b border-neutral-100"
    style="height:${rowHeight}px; width:${gridWidth}px;"
  >
    <div
      class="relative h-full"
      style="
        background-image: linear-gradient(to right, rgba(0,0,0,.08) 1px, transparent 1px);
        background-size: ${slotWidth}px 100%;
      "
    >
      <div
        class="absolute top-3 h-10 rounded-full ${barColorClass} px-4 flex items-center shadow-sm"
        style="left:${left}px; width:${width}px;"
      >
        <span class="text-xs font-black uppercase truncate">
          ${name} · ${formatShiftTime(fields.shift_start)} - ${formatShiftTime(fields.shift_end)}
        </span>
      </div>
    </div>
  </div>
`;
        });

        calendarEl.innerHTML = `
<div
  class="border-b border-neutral-200 bg-base-100 sticky top-0 z-30"
  style="width:${gridWidth}px;"
>
  <div
    class="grid"
    style="grid-template-columns: repeat(${totalSlots}, ${slotWidth}px);"
  >
          ${slots
            .map(
              (slot) => `
                <div class="px-2 py-3 border-r border-neutral-100">
                  <p class="text-[10px] font-black uppercase opacity-60 whitespace-nowrap">
                    ${slot.label}
                  </p>
                </div>
              `,
            )
            .join("")}
        </div>
      </div>

${noShiftsMessage}
${rows.join("")}
${draftRow}
    `;
        setupDraftShiftDrag();
      }

      async function fetchUser() {
        if (!userId) {
          window.location.href = "login.html";
          return;
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          USERS_TABLE,
        )}/${userId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch user");
        }

        const data = await response.json();
        return data.fields;
      }

      async function loadUserHeader() {
        try {
          const user = await fetchUser();

          avatarEl.src =
            user.avatar_url ||
            "https://img.daisyui.com/images/profile/demo/yellingcat@192.webp";

          nameEl.textContent = user.display_name || "User";

          if (user.role && user.role.length > 0) {
            roleEl.textContent = "Loading...";
            await loadRoleName(user.role[0]);
          } else {
            roleEl.textContent = "Standard";
          }
        } catch (err) {
          console.error(err);
        }
      }

      async function loadRoleName(roleRecordId) {
        const url = `https://api.airtable.com/v0/${BASE_ID}/Roles/${roleRecordId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) return;

        const data = await response.json();
        roleEl.textContent = data.fields.name || "Role";
      }

      async function loadDaySchedule() {
        calendarEl.innerHTML = `
      <div class="p-8">
        <p class="uppercase text-sm font-bold opacity-60">Loading schedule...</p>
      </div>
    `;

        const dayString = formatDateForAirtable(viewedDate);
        const [allRecords, workstudyMap] = await Promise.all([
          fetchScheduleRecords(),

          fetchActiveWorkstudiesMap(),
        ]);

        const shiftsForDay = allRecords
          .filter((record) => {
            const fields = record.fields;

            if (!fields.shift_start || !fields.shift_end) return false;

            const shiftDate = fields.shift_date || fields.shift_start;
            const recordDay = formatDateForAirtable(new Date(shiftDate));

            return recordDay === dayString;
          })
          .sort((a, b) => {
            return (
              new Date(a.fields.shift_start) - new Date(b.fields.shift_start)
            );
          });

        renderCalendar(shiftsForDay, workstudyMap);
      }

      prevDayBtn.addEventListener("click", () => {
        viewedDate.setDate(viewedDate.getDate() - 1);
        loadDaySchedule();
      });

      nextDayBtn.addEventListener("click", () => {
        viewedDate.setDate(viewedDate.getDate() + 1);
        loadDaySchedule();
      });

      todayBtn.addEventListener("click", () => {
        viewedDate = new Date();
        viewedDate.setHours(0, 0, 0, 0);
        loadDaySchedule();
      });

      loadUserHeader();

      loadDaySchedule().catch((error) => {
        console.error(error);
        calendarEl.innerHTML = `
      <div class="p-8">
        <p class="uppercase text-sm font-bold text-error">
          Something went wrong loading the schedule.
        </p>
      </div>
    `;
      });
    </script>
  </body>
</html>
