<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPO Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />

    <link href="src/output.css" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
  </head>

  <body class="bg-neutral-100 flex items-center justify-center h-screen">
    <div
      class="bg-base-100 rounded-xl shadow-md px-10 py-16 w-full max-w-md flex flex-col items-center"
    >
      <h1 class="font-black uppercase text-4xl">
        <span class="text-primary">CPO</span> Portal
      </h1>

      <div id="roleChoiceScreen" class="w-full mt-8">
        <h2 class="text-center font-black uppercase text-xl mb-6">
          What is your role?
        </h2>

        <div class="grid grid-cols-2 gap-4">
          <button id="chooseAdminBtn" class="btn h-24 flex-col">
            <i class="fi fi-br-user-gear text-2xl"></i>
            Admin
          </button>

          <button id="chooseStudentBtn" class="btn h-24 flex-col">
            <i class="fi fi-br-graduation-cap text-2xl"></i>
            Student
          </button>
        </div>
      </div>

      <div id="authScreen" class="hidden w-full flex flex-col items-center">
        <div
          role="tablist"
          class="tabs tabs-border w-full uppercase font-bold text-primary mt-4"
        >
          <button id="loginTab" role="tab" class="tab tab-active w-1/2">
            Login
          </button>
          <button id="signupTab" role="tab" class="tab w-1/2">Signup</button>
        </div>

        <!-- login -->
        <div id="loginForm" class="flex flex-col w-full mt-8 uppercase">
          <label class="label font-bold text-sm">Email</label>
          <input
            id="loginEmail"
            type="text"
            class="input w-full h-12 rounded-lg"
          />

          <label class="label font-bold text-sm mt-4">Password</label>
          <input
            id="loginPassword"
            type="password"
            class="input w-full h-12 rounded-lg"
          />

          <button
            id="loginBtn"
            class="btn border-0 shadow-none bg-linear-to-bl from-[#f3f520] to-[#4DB900] mt-8 text-base-100 from-10% h-14 font-bold uppercase text-lg rounded-lg"
          >
            Login
          </button>
        </div>

        <!-- signup -->
        <div id="signupForm" class="hidden flex flex-col w-full mt-8 uppercase">
          <div id="studentSignupFields" class="hidden">
            <label class="label font-bold text-sm">First Name</label>
            <input
              id="signupFirstName"
              type="text"
              class="input w-full h-12 rounded-lg"
            />

            <label class="label font-bold text-sm mt-4">Last Name</label>
            <input
              id="signupLastName"
              type="text"
              class="input w-full h-12 rounded-lg"
            />

            <label class="label font-bold text-sm mt-4">Department</label>
            <select id="signupDepartment" class="select w-full h-12 rounded-lg">
              <option value="">Select Department</option>
              <option value="Front Desk">Front Desk</option>
              <option value="Lab">Lab</option>
            </select>
          </div>

          <label class="label font-bold text-sm mt-4">Email</label>
          <input
            id="signupEmail"
            type="email"
            class="input w-full h-12 rounded-lg"
          />

          <label class="label font-bold text-sm mt-4">Display Name</label>
          <input
            id="signupDisplayName"
            type="text"
            class="input w-full h-12 rounded-lg"
          />

          <label class="label font-bold text-sm mt-4">Password</label>
          <input
            id="signupPassword"
            type="password"
            class="input w-full h-12 rounded-lg"
          />

          <button
            id="signupBtn"
            class="btn border-0 shadow-none bg-linear-to-bl from-[#f3f520] to-[#4DB900] mt-8 text-base-100 from-10% h-14 font-bold uppercase text-lg rounded-lg"
          >
            Create Account
          </button>
        </div>

        <p
          id="authMessage"
          class="text-xs uppercase font-bold opacity-60 mt-4"
        ></p>
      </div>
    </div>

    <script>
      const AIRTABLE_TOKEN =
        "path5D1SLsZnikHyD.8e47f28d9b3b2913d1ebf07e9b1beb8c0903a82bb49266f19cb98fb4021b0129";
      const BASE_ID = "appYqZMGk18beV4qI";
      const USERS_TABLE = "Users";

      // Replace this with the actual Airtable record ID from your Roles table
      const STANDARD_ROLE_ID = "recSTANDARDROLEID";

      const loginTab = document.getElementById("loginTab");
      const signupTab = document.getElementById("signupTab");
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const authMessage = document.getElementById("authMessage");

      const loginBtn = document.getElementById("loginBtn");
      const signupBtn = document.getElementById("signupBtn");

      const ACTIVE_WORKSTUDIES_TABLE = "Active Workstudies";
      const ROLES_TABLE = "Roles";

      let selectedRole = null;

      const roleChoiceScreen = document.getElementById("roleChoiceScreen");
      const authScreen = document.getElementById("authScreen");
      const chooseAdminBtn = document.getElementById("chooseAdminBtn");
      const chooseStudentBtn = document.getElementById("chooseStudentBtn");
      const studentSignupFields = document.getElementById(
        "studentSignupFields",
      );

      function chooseRole(role) {
        selectedRole = role;

        roleChoiceScreen.classList.add("hidden");
        authScreen.classList.remove("hidden");

        studentSignupFields.classList.toggle("hidden", role !== "Student");

        authMessage.textContent = "";
      }

      chooseAdminBtn.addEventListener("click", () => chooseRole("Admin"));
      chooseStudentBtn.addEventListener("click", () => chooseRole("Student"));

      async function fetchRoleIdByName(roleName) {
        const formula = `{name} = "${roleName}"`;

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          ROLES_TABLE,
        )}?filterByFormula=${encodeURIComponent(formula)}`;

        const response = await fetch(url, {
          headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` },
        });

        const data = await response.json();
        return data.records[0]?.id || null;
      }

      async function createActiveWorkstudy({
        firstName,
        lastName,
        department,
        email,
      }) {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          ACTIVE_WORKSTUDIES_TABLE,
        )}`;

        const response = await fetch(url, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            fields: {
              Name: `${lastName}, ${firstName}`,
              "First Name": firstName,
              "Last Name": lastName,
              Status: "Active",
              Department: department,
              "Student Email": email,
            },
          }),
        });

        if (!response.ok) throw new Error(await response.text());
        return response.json();
      }

      function showLogin() {
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");

        loginTab.classList.add("tab-active");
        signupTab.classList.remove("tab-active");

        authMessage.textContent = "";
      }

      function showSignup() {
        signupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");

        signupTab.classList.add("tab-active");
        loginTab.classList.remove("tab-active");

        authMessage.textContent = "";
      }

      loginTab.addEventListener("click", showLogin);
      signupTab.addEventListener("click", showSignup);

      async function createUser({
        email,
        displayName,
        password,
        firstName,
        roleName,
        linkedWorkstudyId,
      }) {
        const roleId = await fetchRoleIdByName(roleName);

        if (!roleId) {
          throw new Error(`Could not find ${roleName} role.`);
        }

        const fields = {
          email,
          display_name: displayName,
          password,
          first_name: firstName || displayName,
          role: [roleId],
        };

        if (roleName === "Student") {
          fields.avatar_url = `https://api.dicebear.com/9.x/bottts-neutral/svg?backgroundColor=7cb342,c0ca33,fdd835&seed=${encodeURIComponent(
            displayName,
          )}`;

          fields.linked_workstudy = [linkedWorkstudyId];
        }

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          USERS_TABLE,
        )}`;

        const response = await fetch(url, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ fields }),
        });

        if (!response.ok) throw new Error(await response.text());
        return response.json();
      }

      signupBtn.addEventListener("click", async () => {
        const email = document.getElementById("signupEmail").value.trim();
        const displayName = document
          .getElementById("signupDisplayName")
          .value.trim();
        const password = document.getElementById("signupPassword").value.trim();

        if (!email || !displayName || !password) {
          authMessage.textContent = "Please fill out all signup fields.";
          return;
        }

        signupBtn.disabled = true;
        signupBtn.textContent = "Creating...";

        let linkedWorkstudyId = null;
        let firstName = "";

        if (selectedRole === "Student") {
          firstName = document.getElementById("signupFirstName").value.trim();
          const lastName = document
            .getElementById("signupLastName")
            .value.trim();
          const department = document.getElementById("signupDepartment").value;

          if (!firstName || !lastName || !department) {
            authMessage.textContent =
              "Please fill out all student signup fields.";
            signupBtn.disabled = false;
            signupBtn.textContent = "Create Account";
            return;
          }

          const workstudy = await createActiveWorkstudy({
            firstName,
            lastName,
            department,
            email,
          });

          linkedWorkstudyId = workstudy.id;
        }

        const newUser = await createUser({
          email,
          displayName,
          password,
          firstName,
          roleName: selectedRole,
          linkedWorkstudyId,
        });

        localStorage.setItem("cpoUserId", newUser.id);
        localStorage.setItem("cpoUserEmail", newUser.fields.email);
        localStorage.setItem(
          "cpoDisplayName",
          newUser.fields.display_name || "",
        );

        if (selectedRole === "Student") {
          window.location.href = "student-portal.html";
        } else {
          window.location.href = "index.html";
        }
      });

      loginBtn.addEventListener("click", async () => {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();

        if (!email || !password) {
          authMessage.textContent = "Please enter your email and password.";
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";

        try {
          const user = await findUserByLogin(email, password);

          if (!user) {
            authMessage.textContent = "Invalid email or password.";
            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
            return;
          }

          localStorage.setItem("cpoUserId", user.id);
          localStorage.setItem("cpoUserEmail", user.fields.email);
          localStorage.setItem(
            "cpoDisplayName",
            user.fields.display_name || "",
          );

          // 👇 NEW: role-based redirect
          let roleName = null;

          if (user.fields.role && user.fields.role.length > 0) {
            roleName = await fetchRoleName(user.fields.role[0]);
          }

          if (selectedRole === "Student") {
            window.location.href = "student-portal.html";
          } else {
            window.location.href = "index.html";
          }
        } catch (error) {
          console.error(error);
          authMessage.textContent = "Something went wrong logging in.";
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
        }
      });

      async function findUserByLogin(email, password) {
        const formula = `AND(
    LOWER({email}) = "${email.toLowerCase()}",
    {password} = "${password}"
  )`;

        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(
          USERS_TABLE,
        )}?filterByFormula=${encodeURIComponent(formula)}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) {
          throw new Error("Could not check login.");
        }

        const data = await response.json();
        return data.records[0];
      }

      async function fetchRoleName(roleId) {
        const url = `https://api.airtable.com/v0/${BASE_ID}/Roles/${roleId}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          },
        });

        if (!response.ok) return null;

        const data = await response.json();
        return data.fields.name;
      }

      // LOGIN ENTER KEY
      document
        .getElementById("loginEmail")
        .addEventListener("keydown", handleLoginEnter);

      document
        .getElementById("loginPassword")
        .addEventListener("keydown", handleLoginEnter);

      function handleLoginEnter(event) {
        if (event.key === "Enter") {
          loginBtn.click();
        }
      }

      // SIGNUP ENTER KEY
      document
        .getElementById("signupEmail")
        .addEventListener("keydown", handleSignupEnter);

      document
        .getElementById("signupDisplayName")
        .addEventListener("keydown", handleSignupEnter);

      document
        .getElementById("signupPassword")
        .addEventListener("keydown", handleSignupEnter);

      function handleSignupEnter(event) {
        if (event.key === "Enter") {
          signupBtn.click();
        }
      }
    </script>
  </body>
</html>
